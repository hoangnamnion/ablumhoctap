<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Album Học</title>
  <style>
    :root {
      --bg: #000000;
      --surface: #000000;
      --surface-2: #141414;
      --border: #ffffff;
      --text: #ffffff;
      --muted: #d4d4d4;
      --primary: #ffffff;
      --primary-hover: #e5e5e5;
      --danger: #ff4d4d;
      --star: #fbbf24;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding-bottom: 84px;
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 14px 16px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: #000000;
      border: 1px solid #ffffff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1rem;
      color: #ffffff;
      flex-shrink: 0;
    }
    .brand-title {
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .stats-pill {
      font-size: 0.78rem;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 8px 13px;
      border-radius: 10px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { background: var(--surface-2); }
    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #000000;
    }
    .btn-primary:hover { background: var(--primary-hover); }

    .view-toggle {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 2px;
    }
    .view-toggle button {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .view-toggle button.active {
      background: var(--surface-2);
      color: var(--text);
    }

    /* Search & Filter Bar */
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    .search-box {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 12px;
      height: 42px;
    }
    .search-box:focus-within { border-color: var(--primary); }
    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      color: var(--text);
      width: 100%;
      font-size: 0.92rem;
    }
    .sort-select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 0 12px;
      height: 42px;
      font-size: 0.86rem;
      outline: none;
      cursor: pointer;
    }

    /* Filter Chips */
    .chips-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .chips-bar::-webkit-scrollbar { display: none; }
    .chip {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .chip.active {
      background: #ffffff;
      border-color: #ffffff;
      color: #000000;
    }

    /* Breadcrumb */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }
    .crumb-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .crumb-btn:hover { background: var(--surface); color: var(--text); }
    .crumb-btn.current { color: var(--text); font-weight: 600; }

    /* Folder Cards */
    .section-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 8px 0 10px;
      font-weight: 600;
    }
    .folder-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .folder-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .folder-card:hover { border-color: var(--primary); background: var(--surface-2); }
    .folder-name {
      flex: 1;
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .folder-acts { display: flex; gap: 4px; }
    .icon-mini {
      border: none;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      width: 28px;
      height: 28px;
      border-radius: 8px;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 0.82rem;
    }
    .icon-mini:hover { background: rgba(255, 255, 255, 0.2); }

    /* Image Grid */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
    }
    .photo-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 4 / 3;
    }
    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.25s;
    }
    .photo-card:hover img { transform: scale(1.03); }
    .photo-overlay {
      position: absolute;
      inset: auto 0 0 0;
      padding: 24px 10px 8px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 6px;
    }
    .photo-name {
      font-size: 0.8rem;
      font-weight: 500;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .photo-size {
      font-size: 0.7rem;
      color: #d1d5db;
      white-space: nowrap;
    }
    .star-float {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 30px;
      height: 30px;
      border-radius: 999px;
      border: 1px solid #ffffff;
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 0.95rem;
    }
    .star-float.starred { color: var(--star); }

    /* List View */
    .list-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .list-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .list-thumb {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      cursor: pointer;
      border: 1px solid var(--border);
    }
    .list-info {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }
    .list-title {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .list-meta {
      font-size: 0.76rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .list-acts { display: flex; gap: 6px; flex-shrink: 0; }

    /* Empty / Dropzone */
    .empty-box {
      border: 2px dashed var(--border);
      background: var(--surface);
      border-radius: 16px;
      padding: 44px 20px;
      text-align: center;
      color: var(--muted);
    }
    .empty-box h3 { color: var(--text); margin: 0 0 8px; font-size: 1.05rem; }
    .empty-box p { margin: 0 0 18px; font-size: 0.88rem; line-height: 1.5; }
    .empty-btns { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }

    /* Mobile Bottom Bar */
    .mobile-bar { display: none; }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.96);
      z-index: 60;
      display: none;
      flex-direction: column;
    }
    .lightbox.open { display: flex; }
    .lb-top {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .lb-title {
      font-size: 0.92rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lb-body {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 16px;
      overflow: auto;
    }
    .lb-body img {
      max-width: 100%;
      max-height: 74dvh;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .lb-bottom {
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .btn-danger {
      background: #000000;
      border-color: #ff4d4d;
      color: #ff4d4d;
    }

    /* Modals */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      z-index: 70;
      display: none;
      place-items: center;
      padding: 16px;
    }
    .modal.open { display: grid; }
    .modal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      padding: 20px;
    }
    .modal-card h3 { margin: 0 0 14px; font-size: 1.05rem; }
    .modal-card input, .modal-card textarea, .modal-card select {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      margin-bottom: 12px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
    }
    .modal-card textarea {
      min-height: 110px;
      font-family: monospace;
      font-size: 13px;
    }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; }

    .toast {
      position: fixed;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      background: #000000;
      border: 1px solid #ffffff;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.86rem;
      z-index: 90;
      display: none;
      white-space: nowrap;
    }
    .toast.show { display: block; }

    /* Upload Status Box */
    .upload-status-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: none;
    }
    .upload-status-box.open { display: block; }
    .upload-status-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .upload-status-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 190px;
      overflow-y: auto;
    }
    .up-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.82rem;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .up-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .up-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }
    .up-badge {
      white-space: nowrap;
      font-size: 0.76rem;
      font-weight: 600;
    }
    .up-badge.ok { color: #4ade80; }
    .up-badge.err { color: #ff4d4d; }
    .up-bar {
      height: 4px;
      background: #262626;
      border-radius: 4px;
      overflow: hidden;
    }
    .up-bar-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
      transition: width 0.15s;
    }

    @media (max-width: 720px) {
      .container { padding: 12px; }
      .desktop-only { display: none !important; }
      .photo-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .photo-card { aspect-ratio: 1 / 1; border-radius: 12px; }
      .folder-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .folder-card { padding: 10px; }
      .mobile-bar {
        display: flex;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: #000000;
        border-top: 1px solid #ffffff;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        gap: 8px;
        z-index: 50;
      }
      .mobile-bar .btn {
        flex: 1;
        justify-content: center;
        padding: 10px 8px;
        font-size: 0.84rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand" onclick="goRoot()">
        <div class="logo">A</div>
        <span class="brand-title">Album Học</span>
        <span class="stats-pill" id="statsPill">0 ảnh</span>
      </div>

      <div class="header-actions">
        <button class="btn" id="wakeBtn" onclick="toggleWakeLock()" title="Giữ màn hình luôn sáng">☀️ Luôn sáng</button>
        <button class="btn desktop-only" onclick="openFolderModal()">📁 Thư mục</button>
        <button class="btn desktop-only" onclick="openB64Modal()">📋 Base64</button>
        <button class="btn btn-primary desktop-only" onclick="document.getElementById('fileInput').click()">＋ Tải ảnh</button>
        <div class="view-toggle">
          <button id="gridBtn" class="active" onclick="setView('grid')" title="Lưới">▦</button>
          <button id="listBtn" onclick="setView('list')" title="Danh sách">☰</button>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Tìm tên ảnh hoặc thư mục..." />
      </div>
      <select class="sort-select" id="sortSelect" onchange="render()">
        <option value="newest">Mới nhất</option>
        <option value="name">Tên A-Z</option>
        <option value="size">Nặng nhất</option>
      </select>
    </div>

    <div class="chips-bar" id="chipsBar"></div>
    <div class="upload-status-box" id="uploadStatusBox">
      <div class="upload-status-head">
        <span id="uploadSummary">Trạng thái gửi ảnh</span>
        <button class="icon-mini" title="Đóng / Xóa danh sách" onclick="clearUploadStatus()">✕</button>
      </div>
      <div class="upload-status-list" id="uploadStatusList"></div>
    </div>
    <div class="breadcrumb" id="breadcrumb"></div>
    <div id="contentArea"></div>
  </div>

  <!-- Mobile Bottom Bar -->
  <div class="mobile-bar">
    <button class="btn" onclick="openFolderModal()">📁 Thư mục</button>
    <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">＋ Tải ảnh</button>
    <button class="btn" onclick="openB64Modal()">📋 Base64</button>
  </div>

  <input type="file" id="fileInput" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden />

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="if(event.target===this) closeLightbox()">
    <div class="lb-top">
      <div class="lb-title" id="lbTitle"></div>
      <button class="btn" onclick="closeLightbox()">✕ Đóng</button>
    </div>
    <div class="lb-body">
      <img id="lbImg" src="" alt="" />
    </div>
    <div class="lb-bottom">
      <button class="btn" id="lbMoveBtn">📁 Chuyển thư mục</button>
      <button class="btn" id="lbCopyUri">Copy Data URI</button>
      <button class="btn" id="lbCopyRaw">Copy Base64</button>
      <a class="btn" id="lbDownload" download style="text-decoration:none">⬇ Tải về</a>
      <a class="btn" id="lbOpenTab" target="_blank" style="text-decoration:none">↗ Mở link</a>
      <button class="btn btn-danger" id="lbDelete">🗑 Xóa</button>
    </div>
  </div>

  <!-- Folder Modal -->
  <div class="modal" id="folderModal" onclick="if(event.target===this) closeFolderModal()">
    <div class="modal-card">
      <h3 id="folderModalTitle">Tạo thư mục mới</h3>
      <input type="text" id="folderNameInput" placeholder="Nhập tên thư mục..." />
      <div class="modal-footer">
        <button class="btn" onclick="closeFolderModal()">Hủy</button>
        <button class="btn btn-primary" onclick="submitFolder()">Lưu</button>
      </div>
    </div>
  </div>

  <!-- Move Modal -->
  <div class="modal" id="moveModal" onclick="if(event.target===this) closeMoveModal()">
    <div class="modal-card">
      <h3>Chuyển ảnh vào thư mục</h3>
      <select id="moveFolderSelect"></select>
      <div class="modal-footer">
        <button class="btn" onclick="closeMoveModal()">Hủy</button>
        <button class="btn btn-primary" onclick="submitMove()">Chuyển</button>
      </div>
    </div>
  </div>

  <!-- Base64 Modal -->
  <div class="modal" id="b64Modal" onclick="if(event.target===this) closeB64Modal()">
    <div class="modal-card">
      <h3>Lưu ảnh từ Base64</h3>
      <input type="text" id="b64Filename" placeholder="Tên file (vd: anh.png)" value="pasted-image.png" />
      <textarea id="b64Textarea" placeholder="Dán chuỗi Base64 hoặc data:image/png;base64,..."></textarea>
      <div class="modal-footer">
        <button class="btn" onclick="closeB64Modal()">Hủy</button>
        <button class="btn btn-primary" onclick="uploadBase64()">Lưu ảnh</button>
      </div>
    </div>
  </div>

  <!-- Admin Password Modal -->
  <div class="modal" id="adminModal" onclick="if(event.target===this) closeAdminModal()">
    <div class="modal-card">
      <h3>🔒 Chỉ Admin mới được xóa</h3>
      <input type="password" id="adminPwdInput" placeholder="Nhập mật khẩu admin..." />
      <div class="modal-footer">
        <button class="btn" onclick="closeAdminModal()">Hủy</button>
        <button class="btn btn-primary" onclick="submitAdminPwd()">Xác nhận xóa</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // Trên HTTPS (Vercel) sẽ tự đi qua vercel.json để tránh lỗi Mixed Content
    const API_BASE = location.protocol === "https:" ? "" : "http://arc.pikamc.vn:25635";

    let allImages = [];
    let allFolders = [];
    let currentTab = "all";
    let currentFolderId = null;
    let currentView = "grid";
    let editingFolderId = null;
    let movingImageId = null;
    let pendingDeleteAction = null;

    const searchInput = document.getElementById("searchInput");
    const fileInput = document.getElementById("fileInput");

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove("show"), 2500);
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / (1024 * 1024)).toFixed(2) + " MB";
    }

    function goRoot() {
      currentTab = "all";
      currentFolderId = null;
      render();
    }

    function openFolder(id) {
      currentTab = "all";
      currentFolderId = id;
      render();
    }

    function setTab(tab) {
      currentTab = tab;
      currentFolderId = null;
      render();
    }

    function setView(v) {
      currentView = v;
      document.getElementById("gridBtn").classList.toggle("active", v === "grid");
      document.getElementById("listBtn").classList.toggle("active", v === "list");
      render();
    }

    async function loadAll() {
      try {
        const [imgRes, fldRes] = await Promise.all([
          fetch(`${API_BASE}/api/images?include_data=1`),
          fetch(`${API_BASE}/api/folders`)
        ]);
        const imgData = await imgRes.json();
        const fldData = await fldRes.json();
        allImages = imgData.images || [];
        allFolders = fldData.folders || [];
        const totalBytes = allImages.reduce((s, i) => s + i.size_bytes, 0);
        document.getElementById("statsPill").textContent = `${allImages.length} ảnh • ${formatBytes(totalBytes)}`;
        render();
      } catch (err) {
        showToast("Không kết nối được tới API server!");
      }
    }

    function renderChips() {
      const bar = document.getElementById("chipsBar");
      bar.innerHTML = "";

      const allChip = document.createElement("button");
      allChip.className = "chip" + (currentTab === "all" && currentFolderId === null ? " active" : "");
      allChip.textContent = "🏠 Tất cả";
      allChip.onclick = goRoot;
      bar.appendChild(allChip);

      const starChip = document.createElement("button");
      starChip.className = "chip" + (currentTab === "starred" ? " active" : "");
      starChip.textContent = "⭐ Yêu thích";
      starChip.onclick = () => setTab("starred");
      bar.appendChild(starChip);

      const roots = allFolders.filter(f => f.parent_id === null);
      for (const f of roots) {
        const c = document.createElement("button");
        c.className = "chip" + (currentTab === "all" && currentFolderId === f.id ? " active" : "");
        c.textContent = "📁 " + f.name;
        c.onclick = () => openFolder(f.id);
        bar.appendChild(c);
      }
    }

    function renderBreadcrumb() {
      const bc = document.getElementById("breadcrumb");
      bc.innerHTML = "";
      if (currentTab === "starred") {
        bc.innerHTML = `<span class="crumb-btn current">⭐ Ảnh yêu thích</span>`;
        return;
      }
      if (currentFolderId === null) return;

      const rootBtn = document.createElement("button");
      rootBtn.className = "crumb-btn";
      rootBtn.textContent = "🏠 Trang chủ";
      rootBtn.onclick = goRoot;
      bc.appendChild(rootBtn);

      const path = [];
      let cursor = currentFolderId;
      while (cursor !== null) {
        const f = allFolders.find(x => x.id === cursor);
        if (!f) break;
        path.unshift(f);
        cursor = f.parent_id;
      }
      path.forEach((f, idx) => {
        const sep = document.createElement("span");
        sep.textContent = "/";
        sep.style.color = "var(--muted)";
        const btn = document.createElement("button");
        btn.className = "crumb-btn" + (idx === path.length - 1 ? " current" : "");
        btn.textContent = f.name;
        btn.onclick = () => openFolder(f.id);
        bc.append(sep, btn);
      });
    }

    function getVisibleFolders() {
      if (currentTab !== "all") return [];
      const q = searchInput.value.trim().toLowerCase();
      if (q) return allFolders.filter(f => f.name.toLowerCase().includes(q));
      return allFolders.filter(f => f.parent_id === currentFolderId);
    }

    function getVisibleImages() {
      const q = searchInput.value.trim().toLowerCase();
      let list = [...allImages];
      if (currentTab === "starred") {
        list = list.filter(i => i.starred === 1);
      } else if (!q) {
        list = list.filter(i => i.folder_id === currentFolderId);
      }
      if (q) {
        list = list.filter(i => i.filename.toLowerCase().includes(q));
      }
      const sort = document.getElementById("sortSelect").value;
      if (sort === "name") list.sort((a, b) => a.filename.localeCompare(b.filename));
      else if (sort === "size") list.sort((a, b) => b.size_bytes - a.size_bytes);
      else list.sort((a, b) => b.id - a.id);
      return list;
    }

    function render() {
      renderChips();
      renderBreadcrumb();

      const folders = getVisibleFolders();
      const images = getVisibleImages();
      const area = document.getElementById("contentArea");
      area.innerHTML = "";

      if (folders.length === 0 && images.length === 0) {
        area.innerHTML = `
          <div class="empty-box">
            <h3>Chưa có ảnh nào ở đây</h3>
            <p>Chọn ảnh từ thiết bị, kéo thả vào màn hình, dán bằng Ctrl+V hoặc tạo thư mục riêng để sắp xếp.</p>
            <div class="empty-btns">
              <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">＋ Tải ảnh lên</button>
              <button class="btn" onclick="openFolderModal()">📁 Tạo thư mục</button>
              <button class="btn" onclick="openB64Modal()">📋 Dán Base64</button>
            </div>
          </div>
        `;
        return;
      }

      if (folders.length > 0) {
        const lbl = document.createElement("div");
        lbl.className = "section-label";
        lbl.textContent = "Thư mục";
        area.appendChild(lbl);

        const fGrid = document.createElement("div");
        fGrid.className = "folder-grid";
        for (const f of folders) {
          const card = document.createElement("div");
          card.className = "folder-card";
          card.onclick = () => openFolder(f.id);

          const icon = document.createElement("span");
          icon.textContent = "📁";

          const name = document.createElement("span");
          name.className = "folder-name";
          name.textContent = f.name;

          const acts = document.createElement("div");
          acts.className = "folder-acts";

          const editBtn = document.createElement("button");
          editBtn.className = "icon-mini";
          editBtn.textContent = "✏️";
          editBtn.onclick = (e) => { e.stopPropagation(); openFolderModal(f); };

          const delBtn = document.createElement("button");
          delBtn.className = "icon-mini";
          delBtn.textContent = "🗑";
          delBtn.onclick = (e) => { e.stopPropagation(); deleteFolder(f.id, f.name); };

          acts.append(editBtn, delBtn);
          card.append(icon, name, acts);
          fGrid.appendChild(card);
        }
        area.appendChild(fGrid);
      }

      if (images.length > 0) {
        if (folders.length > 0) {
          const lbl = document.createElement("div");
          lbl.className = "section-label";
          lbl.textContent = "Ảnh";
          area.appendChild(lbl);
        }

        if (currentView === "grid") {
          const grid = document.createElement("div");
          grid.className = "photo-grid";
          for (const img of images) {
            const dataUri = img.data_uri || `data:${img.mime_type};base64,${img.base64_data}`;
            const card = document.createElement("div");
            card.className = "photo-card";
            card.onclick = () => openLightbox(img);

            const imageEl = document.createElement("img");
            imageEl.src = dataUri;
            imageEl.alt = img.filename;

            const star = document.createElement("button");
            star.className = "star-float" + (img.starred ? " starred" : "");
            star.textContent = img.starred ? "★" : "☆";
            star.onclick = (e) => { e.stopPropagation(); toggleStar(img.id); };

            const overlay = document.createElement("div");
            overlay.className = "photo-overlay";
            const nameEl = document.createElement("span");
            nameEl.className = "photo-name";
            nameEl.textContent = img.filename;
            const sizeEl = document.createElement("span");
            sizeEl.className = "photo-size";
            sizeEl.textContent = formatBytes(img.size_bytes);
            overlay.append(nameEl, sizeEl);

            card.append(imageEl, star, overlay);
            grid.appendChild(card);
          }
          area.appendChild(grid);
        } else {
          const wrap = document.createElement("div");
          wrap.className = "list-wrap";
          for (const img of images) {
            const dataUri = img.data_uri || `data:${img.mime_type};base64,${img.base64_data}`;
            const row = document.createElement("div");
            row.className = "list-row";

            const thumb = document.createElement("img");
            thumb.className = "list-thumb";
            thumb.src = dataUri;
            thumb.onclick = () => openLightbox(img);

            const info = document.createElement("div");
            info.className = "list-info";
            info.onclick = () => openLightbox(img);
            const title = document.createElement("div");
            title.className = "list-title";
            title.textContent = img.filename;
            const meta = document.createElement("div");
            meta.className = "list-meta";
            meta.textContent = `${img.mime_type} • ${formatBytes(img.size_bytes)}`;
            info.append(title, meta);

            const acts = document.createElement("div");
            acts.className = "list-acts";
            const copyBtn = document.createElement("button");
            copyBtn.className = "icon-mini";
            copyBtn.title = "Copy Base64";
            copyBtn.textContent = "📋";
            copyBtn.onclick = async () => {
              await navigator.clipboard.writeText(dataUri);
              showToast("Đã copy Data URI!");
            };
            const delBtn = document.createElement("button");
            delBtn.className = "icon-mini";
            delBtn.title = "Xóa";
            delBtn.textContent = "🗑";
            delBtn.onclick = () => deleteImage(img.id);

            acts.append(copyBtn, delBtn);
            row.append(thumb, info, acts);
            wrap.appendChild(row);
          }
          area.appendChild(wrap);
        }
      }
    }

    function openLightbox(img) {
      const dataUri = img.data_uri || `data:${img.mime_type};base64,${img.base64_data}`;
      document.getElementById("lbTitle").textContent = `${img.filename} (${formatBytes(img.size_bytes)})`;
      document.getElementById("lbImg").src = dataUri;
      document.getElementById("lbOpenTab").href = `${API_BASE}/img/${img.id}`;
      document.getElementById("lbDownload").href = dataUri;
      document.getElementById("lbDownload").download = img.filename;
      document.getElementById("lbMoveBtn").onclick = () => openMoveModal(img);
      document.getElementById("lbCopyUri").onclick = async () => {
        await navigator.clipboard.writeText(dataUri);
        showToast("Đã copy Data URI!");
      };
      document.getElementById("lbCopyRaw").onclick = async () => {
        await navigator.clipboard.writeText(img.base64_data);
        showToast("Đã copy chuỗi Base64 thuần!");
      };
      document.getElementById("lbDelete").onclick = async () => {
        await deleteImage(img.id);
        closeLightbox();
      };
      document.getElementById("lightbox").classList.add("open");
    }
    function closeLightbox() { document.getElementById("lightbox").classList.remove("open"); }

    function openFolderModal(folder = null) {
      editingFolderId = folder ? folder.id : null;
      document.getElementById("folderModalTitle").textContent = folder ? "Đổi tên thư mục" : "Tạo thư mục mới";
      const input = document.getElementById("folderNameInput");
      input.value = folder ? folder.name : "";
      document.getElementById("folderModal").classList.add("open");
      setTimeout(() => input.focus(), 50);
    }
    function closeFolderModal() { document.getElementById("folderModal").classList.remove("open"); }

    async function submitFolder() {
      const name = document.getElementById("folderNameInput").value.trim();
      if (!name) return showToast("Vui lòng nhập tên thư mục.");
      if (editingFolderId) {
        const res = await fetch(`${API_BASE}/api/folders/${editingFolderId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name })
        });
        if (res.ok) showToast("Đã đổi tên thư mục");
      } else {
        const res = await fetch(`${API_BASE}/api/folders`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, parent_id: currentFolderId })
        });
        if (res.ok) showToast(`Đã tạo thư mục "${name}"`);
      }
      closeFolderModal();
      await loadAll();
    }

    function getAdminPass() {
      return sessionStorage.getItem("admin_pass") || "";
    }

    function requireAdmin(action) {
      if (getAdminPass()) {
        action();
        return;
      }
      pendingDeleteAction = action;
      const input = document.getElementById("adminPwdInput");
      input.value = "";
      document.getElementById("adminModal").classList.add("open");
      setTimeout(() => input.focus(), 50);
    }

    function closeAdminModal() {
      document.getElementById("adminModal").classList.remove("open");
      pendingDeleteAction = null;
    }

    async function submitAdminPwd() {
      const pwd = document.getElementById("adminPwdInput").value;
      if (!pwd) return showToast("Vui lòng nhập mật khẩu!");
      const res = await fetch(`${API_BASE}/api/admin/verify`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pwd })
      });
      if (!res.ok) {
        return showToast("Sai mật khẩu admin!");
      }
      sessionStorage.setItem("admin_pass", pwd);
      const act = pendingDeleteAction;
      closeAdminModal();
      if (act) await act();
    }

    async function deleteFolder(id, name) {
      if (!confirm(`Xóa thư mục "${name}"? Ảnh bên trong sẽ chuyển về Trang chủ.`)) return;
      requireAdmin(async () => {
        const res = await fetch(`${API_BASE}/api/folders/${id}`, {
          method: "DELETE",
          headers: { "X-Admin-Password": getAdminPass() }
        });
        if (res.status === 403) {
          sessionStorage.removeItem("admin_pass");
          showToast("Sai mật khẩu admin!");
          return;
        }
        if (res.ok) {
          if (currentFolderId === id) currentFolderId = null;
          showToast(`Đã xóa thư mục "${name}"`);
          await loadAll();
        }
      });
    }

    function openMoveModal(img) {
      movingImageId = img.id;
      const sel = document.getElementById("moveFolderSelect");
      sel.innerHTML = `<option value="">🏠 Trang chủ (Thư mục gốc)</option>`;
      for (const f of allFolders) {
        const opt = document.createElement("option");
        opt.value = f.id;
        opt.textContent = "📁 " + f.name;
        if (img.folder_id === f.id) opt.selected = true;
        sel.appendChild(opt);
      }
      document.getElementById("moveModal").classList.add("open");
    }
    function closeMoveModal() { document.getElementById("moveModal").classList.remove("open"); }
    async function submitMove() {
      const val = document.getElementById("moveFolderSelect").value;
      const folder_id = val ? parseInt(val, 10) : null;
      const res = await fetch(`${API_BASE}/api/images/${movingImageId}/move`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ folder_id })
      });
      if (res.ok) {
        closeMoveModal();
        showToast("Đã chuyển thư mục");
        await loadAll();
      }
    }

    function openB64Modal() { document.getElementById("b64Modal").classList.add("open"); }
    function closeB64Modal() { document.getElementById("b64Modal").classList.remove("open"); }

    let uploadQueue = [];

    function renderUploadStatus() {
      const box = document.getElementById("uploadStatusBox");
      const list = document.getElementById("uploadStatusList");
      const summary = document.getElementById("uploadSummary");
      if (uploadQueue.length === 0) {
        box.classList.remove("open");
        return;
      }
      box.classList.add("open");
      const done = uploadQueue.filter(x => x.status === "ok").length;
      const fail = uploadQueue.filter(x => x.status === "err").length;
      const sending = uploadQueue.filter(x => x.status === "sending").length;
      summary.textContent = `Trạng thái gửi ảnh: ${done}/${uploadQueue.length} đã lên` +
        (sending ? ` • ${sending} đang gửi` : "") +
        (fail ? ` • ${fail} lỗi` : "");

      list.innerHTML = "";
      for (const item of uploadQueue) {
        const row = document.createElement("div");
        row.className = "up-item";

        const top = document.createElement("div");
        top.className = "up-row";

        const name = document.createElement("span");
        name.className = "up-name";
        name.textContent = item.name;

        const badge = document.createElement("span");
        badge.className = "up-badge " + (item.status === "ok" ? "ok" : item.status === "err" ? "err" : "");
        if (item.status === "sending") badge.textContent = `⏳ Đang gửi (${item.progress}%)`;
        else if (item.status === "ok") badge.textContent = "✅ Đã lên";
        else badge.textContent = `❌ ${item.error || "Lỗi"}`;

        top.append(name, badge);

        const bar = document.createElement("div");
        bar.className = "up-bar";
        const fill = document.createElement("div");
        fill.className = "up-bar-fill";
        fill.style.width = item.progress + "%";
        if (item.status === "ok") fill.style.background = "#4ade80";
        if (item.status === "err") fill.style.background = "#ff4d4d";
        bar.appendChild(fill);

        row.append(top, bar);
        list.appendChild(row);
      }
    }

    function clearUploadStatus() {
      uploadQueue = uploadQueue.filter(x => x.status === "sending");
      renderUploadStatus();
    }

    function uploadFile(file) {
      return new Promise((resolve) => {
        const entry = { name: file.name, progress: 0, status: "sending", error: "" };
        uploadQueue.unshift(entry);
        renderUploadStatus();

        const form = new FormData();
        form.append("file", file);
        if (currentFolderId !== null && currentTab === "all") {
          form.append("folder_id", String(currentFolderId));
        }

        const xhr = new XMLHttpRequest();
        xhr.open("POST", `${API_BASE}/api/upload`);
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            entry.progress = Math.round((e.loaded / e.total) * 100);
            renderUploadStatus();
          }
        };
        xhr.onload = async () => {
          let data = {};
          try { data = JSON.parse(xhr.responseText); } catch {}
          if (xhr.status >= 200 && xhr.status < 300) {
            entry.progress = 100;
            entry.status = "ok";
            renderUploadStatus();
            await loadAll();
          } else {
            entry.status = "err";
            entry.error = data.error || `Lỗi ${xhr.status}`;
            renderUploadStatus();
          }
          resolve();
        };
        xhr.onerror = () => {
          entry.status = "err";
          entry.error = "Mất kết nối server";
          renderUploadStatus();
          resolve();
        };
        xhr.send(form);
      });
    }

    async function uploadBase64() {
      const raw = document.getElementById("b64Textarea").value.trim();
      const filename = document.getElementById("b64Filename").value.trim() || "pasted-image.png";
      if (!raw) return showToast("Vui lòng dán chuỗi Base64.");

      const entry = { name: filename, progress: 40, status: "sending", error: "" };
      uploadQueue.unshift(entry);
      closeB64Modal();
      renderUploadStatus();

      const folder_id = (currentTab === "all") ? currentFolderId : null;
      try {
        const res = await fetch(`${API_BASE}/api/upload`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ filename, base64: raw, folder_id })
        });
        const data = await res.json();
        if (!res.ok) {
          entry.status = "err";
          entry.error = data.error || "Lưu thất bại";
        } else {
          entry.progress = 100;
          entry.status = "ok";
          document.getElementById("b64Textarea").value = "";
          await loadAll();
        }
      } catch {
        entry.status = "err";
        entry.error = "Mất kết nối server";
      }
      renderUploadStatus();
    }

    async function toggleStar(id) {
      const res = await fetch(`${API_BASE}/api/images/${id}/star`, { method: "PATCH" });
      if (res.ok) await loadAll();
    }

    async function deleteImage(id) {
      requireAdmin(async () => {
        const res = await fetch(`${API_BASE}/api/images/${id}`, {
          method: "DELETE",
          headers: { "X-Admin-Password": getAdminPass() }
        });
        if (res.status === 403) {
          sessionStorage.removeItem("admin_pass");
          showToast("Sai mật khẩu admin!");
          return;
        }
        if (res.ok) {
          closeLightbox();
          showToast("Đã xóa ảnh");
          await loadAll();
        }
      });
    }

    searchInput.addEventListener("input", render);
    fileInput.addEventListener("change", async (e) => {
      for (const file of e.target.files) await uploadFile(file);
      fileInput.value = "";
    });

    window.addEventListener("dragover", (e) => e.preventDefault());
    window.addEventListener("drop", async (e) => {
      e.preventDefault();
      for (const file of e.dataTransfer.files) await uploadFile(file);
    });
    window.addEventListener("paste", async (e) => {
      const items = e.clipboardData?.items || [];
      for (const item of items) {
        if (item.type.startsWith("image/")) {
          const file = item.getAsFile();
          if (file) await uploadFile(file);
        }
      }
    });
    document.getElementById("folderNameInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitFolder();
    });
    document.getElementById("adminPwdInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitAdminPwd();
    });
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeLightbox();
        closeB64Modal();
        closeFolderModal();
        closeMoveModal();
        closeAdminModal();
      }
    });

    let wakeLock = null;
    let wakeEnabled = true;

    async function requestWakeLock() {
      const btn = document.getElementById("wakeBtn");
      if (!("wakeLock" in navigator)) {
        if (btn) btn.style.display = "none";
        return;
      }
      if (!wakeEnabled) return;
      try {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => {
          updateWakeBtn();
        });
        updateWakeBtn();
      } catch {
        updateWakeBtn();
      }
    }

    function updateWakeBtn() {
      const btn = document.getElementById("wakeBtn");
      if (!btn) return;
      if (!wakeEnabled) {
        btn.textContent = "🌙 Tự tắt";
        btn.style.opacity = "0.65";
      } else if (wakeLock) {
        btn.textContent = "☀️ Luôn sáng";
        btn.style.opacity = "1";
      } else {
        btn.textContent = "☀️ Luôn sáng";
        btn.style.opacity = "0.85";
      }
    }

    async function toggleWakeLock() {
      wakeEnabled = !wakeEnabled;
      if (wakeEnabled) {
        await requestWakeLock();
        showToast("Đã bật giữ màn hình luôn sáng");
      } else {
        if (wakeLock) {
          await wakeLock.release();
          wakeLock = null;
        }
        updateWakeBtn();
        showToast("Đã tắt giữ màn hình luôn sáng");
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && wakeEnabled) {
        requestWakeLock();
      }
    });
    window.addEventListener("pointerdown", () => {
      if (wakeEnabled && !wakeLock) requestWakeLock();
    }, { passive: true });

    requestWakeLock();
    loadAll();
  </script>
</body>
</html>
